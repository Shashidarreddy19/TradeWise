# ==============================
# Application Configuration
# ==============================
spring.application.name=trade-backend
server.port=${PORT:8081}

# ==============================
# PRIMARY Database: InternationalTrade (auth, products, orders, shipments)
# ==============================
spring.datasource.url=${DB_MAIN_URL:jdbc:mysql://localhost:3306/InternationalTrade?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_MAIN_USERNAME:root}
spring.datasource.password=${DB_MAIN_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.pool-name=PrimaryHikariPool

# ==============================
# SECONDARY Database: TradeData (HS codes, regulations, compliance)
# ==============================
tradedata.datasource.url=${DB_TRADEDATA_URL:jdbc:mysql://localhost:3306/TradeData?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
tradedata.datasource.username=${DB_TRADEDATA_USERNAME:root}
tradedata.datasource.password=${DB_TRADEDATA_PASSWORD:root}
tradedata.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
tradedata.datasource.hikari.maximum-pool-size=10
tradedata.datasource.hikari.minimum-idle=5
tradedata.datasource.hikari.idle-timeout=60000
tradedata.datasource.hikari.max-lifetime=1800000
tradedata.datasource.hikari.connection-timeout=20000
tradedata.datasource.hikari.keepalive-time=30000
tradedata.datasource.hikari.pool-name=TradeDataHikariPool

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=${JWT_SECRET:TradePlatformSecretKey2024XYZ!@#$%^SecureKey}
app.jwt.expiration-ms=86400000

# ==============================
# NVIDIA AI Configuration (Hybrid Multimodal RAG Architecture)
# ==============================
# SECURITY: API key MUST be supplied via the NVIDIA_API_KEY environment variable.
# Never hardcode the key here or commit it to source control.
nvidia.api.key=${NVIDIA_API_KEY:}
nvidia.base.url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}

# Main LLM — grounded answer generation, summarization, negotiation (reasoning-capable)
nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
nvidia.llm.max-tokens=${NVIDIA_LLM_MAX_TOKENS:4096}
nvidia.llm.temperature=${NVIDIA_LLM_TEMPERATURE:0.2}
nvidia.llm.top-p=${NVIDIA_LLM_TOP_P:0.95}
# Reasoning ("thinking") controls for Nemotron-3-Ultra. Disabled by default to keep
# regulatory answers concise and fast; enable if deeper reasoning is desired.
nvidia.llm.enable-thinking=${NVIDIA_LLM_ENABLE_THINKING:false}
nvidia.llm.reasoning-budget=${NVIDIA_LLM_REASONING_BUDGET:4096}

# Embedding model — semantic RAG retrieval (query/passage input types, up to 8192 tokens)
nvidia.embedding.model=${NVIDIA_EMBED_MODEL:nvidia/llama-nemotron-embed-1b-v2}

# Multimodal reranker — reranks text + image passages against the query
nvidia.rerank.model=${NVIDIA_RERANK_MODEL:nvidia/llama-nemotron-rerank-vl-1b-v2}
nvidia.rerank.url=${NVIDIA_RERANK_URL:https://ai.api.nvidia.com/v1/retrieval/nvidia/llama-nemotron-rerank-vl-1b-v2/reranking}

# RAG tuning
rag.vector.top-k=${RAG_VECTOR_TOP_K:12}
rag.rerank.top-n=${RAG_RERANK_TOP_N:6}
rag.chunk.size=${RAG_CHUNK_SIZE:1200}
rag.chunk.overlap=${RAG_CHUNK_OVERLAP:200}

# TradeData schema mode: update (empty/demo) or none (pipeline-owned production schema)
tradedata.jpa.ddl-auto=${TRADEDATA_DDL_AUTO:update}

# Extra CORS origins (comma-separated). Localhost patterns are always allowed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Reverse-proxy headers (nginx / docker)
server.forward-headers-strategy=framework

# spring-dotenv: do not fail if .env is absent (Docker / CI inject env vars instead)
dotenv.ignoreIfMissing=true

# ==============================
# Logging
# ==============================
logging.level.com.trade=INFO
logging.level.org.springframework.security=INFO
logging.level.com.trade.regulatory=INFO
