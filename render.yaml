services:
  - type: web
    name: tradewise-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_MAIN_URL
        sync: false
      - key: DB_MAIN_USERNAME
        sync: false
      - key: DB_MAIN_PASSWORD
        sync: false
      - key: DB_TRADEDATA_URL
        sync: false
      - key: DB_TRADEDATA_USERNAME
        sync: false
      - key: DB_TRADEDATA_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: tradewise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
